name: Xcode - Build and Analyze

on:
  push:
    branches: [ "microsoft/develop" ]
  pull_request:
    branches: [ "microsoft/develop" ]

jobs:
  build:
    name: Build and analyze using xcodebuild
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby for CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Install project dependencies
        run: |
          cd Example
          pod install
        working-directory: .

      - name: List Xcode schemes
        run: |
          echo "Available schemes:"
          xcodebuild -workspace Example/healthvault-ios-sdk.xcworkspace -list

      - name: Build and Analyze project
        run: |
          xcodebuild clean build analyze \
          -workspace Example/healthvault-ios-sdk.xcworkspace \
          -scheme healthvault-ios-sdk-Example \
          -sdk iphonesimulator \
          -destination 'platform=iOS Simulator,name=iPhone 14' | xcpretty
